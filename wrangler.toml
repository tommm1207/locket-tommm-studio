name = "locket-tommm-studio"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
AI_OUTPUT_SIZE = "768"
GITHUB_ASSETS_BASE = "https://raw.githubusercontent.com/tommm1207/locket-tommm-studio/main/assets"
# Fallback Google Gemini khi Cloudflare Workers AI hết quota 4006 (10.000 neurons/ngày).
# API key KHÔNG để ở đây — lưu bằng: npx wrangler secret put GEMINI_API_KEY  (an toàn, không commit).
# Dùng alias "-latest" để Google tự trỏ về bản Flash free mới nhất (khỏi phải sửa tên model khi Google đổi).
# Nếu muốn ghim bản cụ thể (vd gemini-3.6-flash), chỉ cần đổi giá trị dưới đây rồi deploy lại.
GEMINI_TEXT_MODEL = "gemini-flash-latest"
GEMINI_IMAGE_MODEL = "gemini-flash-image-latest"
# ---- FALLBACK CAPTION (TEXT) — mỗi secret có thể dán NHIỀU KEY, cách nhau bằng dấu phẩy ----
# Worker tự xoay vòng key; key nào hết quota/429 sẽ nghỉ 20' rồi dùng lại. Nhiều Gmail = nhiều key.
#   npx wrangler secret put NVIDIA_API_KEY   (vd: nvapi-aaa,nvapi-bbb,nvapi-ccc)
#   npx wrangler secret put GROQ_API_KEY     (vd: gsk_aaa,gsk_bbb)
#   npx wrangler secret put GEMINI_API_KEY   (vd: AIza_aaa,AIza_bbb)
NVIDIA_MODEL = "meta/llama-3.2-11b-vision-instruct"
GROQ_MODEL = "openai/gpt-oss-120b"
# ---- FALLBACK ẢNH (tách nền weekday_depth + AI 3D) ----
# Cách nhân quota ảnh TỐT NHẤT: tạo thêm tài khoản Cloudflare (mỗi Gmail +10.000 neurons/ngày, cùng FLUX).
# NVIDIA img2img: TẮT (26/11/2026). Đã verify: endpoint asset upload NVCF (api.nvcf.nvidia.com/v2/nvcf/assets)
# trả 410 Gone từ mọi nơi -> không gửi được ảnh đầu vào -> img2img không chạy. (t2i thì chạy nhưng không giữ mặt.)
# Nếu sau này NVIDIA phục hồi asset API: bỏ comment dòng dưới (flux.2 steps<=4; flux-3 đặt NVIDIA_IMAGE_MODE="flux3").
# NVIDIA_IMAGE_MODEL = "black-forest-labs/flux.2-klein-4b"

[durable_objects]
bindings = [
  { name = "STUDIO", class_name = "StudioRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StudioRoom"]
